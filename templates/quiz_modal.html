<!-- 🧠 Interactive Quiz Modal -->
<div class="modal fade" id="quizModal" tabindex="-1" aria-labelledby="quizModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title" id="quizModalLabel">🌿 Spice Knowledge Quiz</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <p class="mb-3">🧐 <strong>Question:</strong> Which of the following spices is highest in antioxidants?</p>

        <div class="form-check form-check-custom mb-2">
          <input class="form-check-input" type="radio" name="interest" id="turmeric" value="Turmeric">
          <label class="form-check-label" for="turmeric">🌼 Turmeric</label>
        </div>

        <div class="form-check form-check-custom mb-2">
          <input class="form-check-input" type="radio" name="interest" id="cumin" value="Cumin">
          <label class="form-check-label" for="cumin">🌰 Cumin</label>
        </div>

        <div class="form-check form-check-custom mb-2">
          <input class="form-check-input" type="radio" name="interest" id="pepper" value="Pepper">
          <label class="form-check-label" for="pepper">🧂 Black Pepper</label>
        </div>

        <div id="quiz-feedback" class="mt-3 fw-semibold text-center" style="min-height: 24px;"></div>
      </div>

      <div class="modal-footer justify-content-between">
        <button id="submitAnswer" class="btn btn-success">✅ Submit</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Skip</button>
      </div>
    </div>
  </div>
</div>

<style>
  .form-check-input:checked + .form-check-label {
    font-weight: 600;
    color: #198754;
  }

  #quiz-feedback {
    transition: all 0.3s ease;
  }
</style>
