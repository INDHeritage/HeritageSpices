{% extends "base.html" %}

{% block title %}Wholesale Inquiry | Heritage Spices{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="text-center mb-4">
        <h1 class="display-6 fw-bold text-success mb-2">Wholesale Distribution Inquiry</h1>
        <p class="text-muted">Tell us a bit about your business and our team will reach out within 48 hours.</p>
      </div>

      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-header bg-success text-white border-0 py-3 rounded-top-4">
          <h5 class="mb-0 fw-bold"><i class="fas fa-store me-2"></i>Business Details</h5>
        </div>
        <div class="card-body p-4 p-md-5">
          <form method="POST" action="{{ url_for('wholesale_inquiry') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="row g-3">
              <div class="col-md-6">
                <label for="business_name" class="form-label fw-semibold">Business / Shop Name *</label>
                <input type="text" class="form-control bg-light" id="business_name" name="business_name"
                       value="{{ business_name or '' }}" required placeholder="Sharma General Store">
              </div>
              <div class="col-md-6">
                <label for="phone" class="form-label fw-semibold">Phone Number *</label>
                <div class="input-group">
                  <span class="input-group-text bg-light">+91</span>
                  <input type="tel" class="form-control bg-light" id="phone" name="phone"
                         value="{{ phone or '' }}" required pattern="[0-9]{10}" placeholder="9876543210">
                </div>
              </div>
              <div class="col-md-6">
                <label for="city" class="form-label fw-semibold">City *</label>
                <input type="text" class="form-control bg-light" id="city" name="city"
                       value="{{ city or '' }}" required placeholder="Kochi">
              </div>
              <div class="col-12">
                <label for="message" class="form-label fw-semibold">Additional Details</label>
                <textarea class="form-control bg-light" id="message" name="message" rows="4"
                          placeholder="Expected order volume, current products sold, anything else we should know">{{ message or '' }}</textarea>
              </div>
            </div>

            <button type="submit" class="btn btn-success w-100 mt-4 py-2 fw-bold">
              <i class="fas fa-paper-plane me-2"></i>Submit Inquiry
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
