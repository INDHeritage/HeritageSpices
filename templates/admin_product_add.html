{% extends "base.html" %}
{% block title %}Add Product | Heritage Spices{% endblock %}
{% block content %}
<div class="container py-5">
  <h1 class="text-success mb-4">➕ Add New Product</h1>
  <form method="POST" enctype="multipart/form-data" class="border p-4 rounded shadow-sm bg-light">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">Product Name</label>
      <input type="text" class="form-control" name="name" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea class="form-control" name="description" rows="4" required></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Price (optional)</label>
      <input type="number" step="0.01" class="form-control" name="price">
    </div>
    <div class="mb-3">
      <label class="form-label">Meesho Buy Link (optional)</label>
      <input type="url" class="form-control" name="meesho_link">
    </div>
    <div class="mb-3">
      <label class="form-label">Image</label>
      <input type="file" class="form-control" name="image" accept="image/*" required>
    </div>
    <button type="submit" class="btn btn-success">Add Product</button>
    <a href="/products" class="btn btn-secondary ms-2">Cancel</a>
  </form>
</div>
{% endblock %}
