{% extends "base.html" %}
{% block title %}Contact | Heritage Spices{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row">
    <div class="col-md-6 mb-4">
      <h1 class="fw-bold text-success mb-3"><i class="fas fa-envelope-open-text me-2"></i>Contact Us</h1>
      <form method="POST" action="/contact">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label for="contact-name" class="form-label fw-semibold">Your Name</label>
          <input type="text" class="form-control" id="contact-name" name="name" placeholder="Jane Doe" required autocomplete="name">
        </div>
        <div class="mb-3">
          <label for="contact-email" class="form-label fw-semibold">Your Email</label>
          <input type="email" class="form-control" id="contact-email" name="email" placeholder="jane@example.com" required autocomplete="email">
        </div>
        <div class="mb-3">
          <label for="contact-message" class="form-label fw-semibold">Your Message</label>
          <textarea class="form-control" id="contact-message" name="message" rows="5" placeholder="How can we help?" required></textarea>
        </div>
        <button class="btn btn-success" type="submit">Send Message</button>
      </form>
    </div>
    <div class="col-md-6 mb-4">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body">
          <h5 class="card-title"><i class="fas fa-map-marker-alt me-2"></i>Our Address</h5>
          <p class="card-text">India, Maharashtra, Sindewahi 441222</p>
          <h5 class="card-title mt-4"><i class="fas fa-envelope me-2"></i>Email</h5>
          <p class="card-text">heritage.spices.pvtltd@gmail.com</p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
