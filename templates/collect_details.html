<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Customer Details</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <script>
    let skipTimer;

    // Redirect to home after 2 seconds of inactivity
    function startSkipTimer() {
      skipTimer = setTimeout(() => {
        window.location.href = "/";
      }, 2000); // 2 seconds
    }

    function resetSkipTimer() {
      clearTimeout(skipTimer);
      startSkipTimer();
    }

    document.addEventListener("DOMContentLoaded", () => {
      startSkipTimer();

      // Reset timer on user interaction
      document.addEventListener("mousemove", resetSkipTimer);
      document.addEventListener("keydown", resetSkipTimer);
      document.addEventListener("click", resetSkipTimer);
    });
  </script>
</head>
<body class="container mt-5">
  <h2>Hello, {{ user.name }} 👋</h2>

  <form method="POST">
    <div class="mb-3">
      <label for="phone" class="form-label">Phone Number</label>
      <input type="text" class="form-control" id="phone" name="phone">
    </div>
    <div class="mb-3">
      <label for="location" class="form-label">Location</label>
      <input type="text" class="form-control" id="location" name="location">
    </div>
    <div class="mb-3">
      <label for="interest" class="form-label">Interest</label>
      <input type="text" class="form-control" id="interest" name="interest">
    </div>
    <button type="submit" class="btn btn-success">Submit Details</button>
    <a href="/" class="btn btn-secondary ms-2">Skip</a>
  </form>
</body>
</html>
