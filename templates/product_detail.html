{% extends "base.html" %}

{% block title %}{{ product.name }} | Indian Heritage Spices{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="row">
    <div class="col-md-6 text-center">
      <img src="{{ url_for('static', filename='images/products/' ~ product.image) }}" alt="{{ product.name }}" class="img-fluid rounded shadow-sm" style="max-height: 350px;" />
    </div>
    <div class="col-md-6">
      <h2 class="fw-bold text-success">{{ product.name }}</h2>
      <p class="mt-3">{{ product.description }}</p>
      <p class="fw-bold fs-4 text-success">₹{{ product.price }}</p>
      <a href="/shop" class="btn btn-outline-success">🛒 Buy Now on Meesho</a>
    </div>
  </div>
</div>
{% endblock %}
