<!-- 🍛 "What will you cook?" — tap a dish, get a practical tip for using the masala -->
<section class="dish-picker container mt-5 motion-section" aria-labelledby="dishPickerTitle">
  <h3 class="section-title text-center mb-2" id="dishPickerTitle">What will you cook today?</h3>
  <p class="text-center text-muted mb-4">Tap a dish to see how to use our Garam Masala.</p>

  <div class="dish-buttons d-flex flex-wrap justify-content-center gap-2 mb-4" role="group" aria-label="Choose a dish">
    <button type="button" class="dish-btn" data-dish="paneer"><i class="fas fa-cheese"></i> Paneer curry</button>
    <button type="button" class="dish-btn" data-dish="chicken"><i class="fas fa-drumstick-bite"></i> Chicken curry</button>
    <button type="button" class="dish-btn" data-dish="biryani"><i class="fas fa-bowl-rice"></i> Veg biryani</button>
    <button type="button" class="dish-btn" data-dish="dal"><i class="fas fa-mortar-pestle"></i> Dal tadka</button>
    <button type="button" class="dish-btn" data-dish="sabzi"><i class="fas fa-carrot"></i> Dry sabzi</button>
  </div>

  <div class="dish-card mx-auto" id="dishCard" aria-live="polite" hidden>
    <h5 class="fw-bold mb-3" id="dishName"></h5>
    <div class="row g-3 text-center">
      <div class="col-md-4"><div class="dish-fact"><small>When to add</small><span id="dishWhen"></span></div></div>
      <div class="col-md-4"><div class="dish-fact"><small>How much</small><span id="dishAmount"></span></div></div>
      <div class="col-md-4"><div class="dish-fact"><small>Tip</small><span id="dishTip"></span></div></div>
    </div>
    <div class="text-center mt-3">
      <a href="#products" class="btn btn-success rounded-pill px-4"><i class="fas fa-cart-plus me-1"></i> Get Garam Masala</a>
    </div>
  </div>
</section>

<style>
  .dish-btn {
    border: 1.5px solid #1b4332; background: #fff; color: #1b4332; border-radius: 999px;
    padding: 8px 16px; font-weight: 600; transition: all .2s ease;
  }
  .dish-btn:hover { background: #eaf3ee; }
  .dish-btn.active { background: #1b4332; color: #fff; }
  .dish-card {
    max-width: 760px; background: #fff; border: 1px solid #efe6d2; border-radius: 16px;
    padding: 22px; box-shadow: 0 4px 16px rgba(0,0,0,.06);
  }
  .dish-fact { background: #faf5ea; border-radius: 12px; padding: 12px; height: 100%; }
  .dish-fact small { display: block; text-transform: uppercase; color: #8a7a5a; font-size: .7rem; margin-bottom: 4px; }
  .dish-fact span { color: #333; font-size: .95rem; }
</style>
<script>
(function () {
  var dishes = {
    paneer:  { name: 'Paneer curry (serves 4)',  when: 'Stir in during the last 2 minutes, after the gravy is ready.', amount: '½ teaspoon',                 tip: 'Add it off the heat so the aroma stays fresh.' },
    chicken: { name: 'Chicken curry (serves 4)', when: 'Half while the masala cooks, half just before serving.',     amount: '1 teaspoon in total',        tip: 'Marinate the chicken with a pinch for deeper flavour.' },
    biryani: { name: 'Veg biryani (serves 4)',   when: 'One part in the marinade, one sprinkled between the rice layers.', amount: '1 to 1½ teaspoons',      tip: 'Finish with a little ghee on top before dum.' },
    dal:     { name: 'Dal tadka (serves 4)',     when: 'In the tadka, right after the tempering, then pour over the dal.', amount: '¼ to ½ teaspoon',         tip: 'A little goes a long way in dal — start small.' },
    sabzi:   { name: 'Dry sabzi (serves 4)',     when: 'In the last 2 to 3 minutes of cooking.',                     amount: '½ teaspoon',                 tip: 'Toss on low heat for a minute so it coats evenly.' }
  };
  var card = document.getElementById('dishCard');
  if (!card) return;
  document.querySelectorAll('.dish-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var d = dishes[btn.getAttribute('data-dish')];
      document.querySelectorAll('.dish-btn').forEach(function (b) { b.classList.remove('active'); b.removeAttribute('aria-pressed'); });
      btn.classList.add('active'); btn.setAttribute('aria-pressed', 'true');
      document.getElementById('dishName').textContent = d.name;
      document.getElementById('dishWhen').textContent = d.when;
      document.getElementById('dishAmount').textContent = d.amount;
      document.getElementById('dishTip').textContent = d.tip;
      card.hidden = false;
    });
  });
})();
</script>
