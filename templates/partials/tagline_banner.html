<!-- 🔥 Tagline Banner -->
<section class="tagline-banner motion-section text-center">
  <div class="container position-relative">
    <h2 class="tagline-heading" id="taglineHeading" aria-label="One Spice. Every Dish. Every Time."><span class="tl-a">One Spice.</span> <span class="tl-b">Every Dish. Every Time.</span></h2>
    <p class="tagline-sub">Rooted in Tradition. Rich in Flavor. Straight from our partner farms to your kitchen.</p>
    <a href="/products" class="btn tagline-btn">
      <i class="fas fa-fire me-2"></i>Shop The Collection
    </a>
  </div>
</section>

<style>
  .tagline-banner {
    position: relative;
    overflow: hidden;
    padding: 5rem 1rem;
    margin-top: 2rem;
  }

  .tagline-heading {
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: clamp(1.8rem, 5vw, 3.2rem);
    color: #6b1d14;
    margin-bottom: 1rem;
    text-shadow:
      0 0 4px rgba(107, 29, 20, 0.35),
      0 0 10px rgba(107, 29, 20, 0.2);
    animation: tagline-glow 2.4s ease-in-out infinite alternate;
  }

  .tagline-heading .tl-b {
    display: block;
    color: #d4a017;
    font-size: 1.1em;
  }
  .tagline-heading .tl-a, .tagline-heading .tl-b { transition: opacity .6s ease; }
  .tagline-heading.fading .tl-a, .tagline-heading.fading .tl-b { opacity: 0; }

  @keyframes tagline-glow {
    from {
      text-shadow:
        0 0 4px rgba(107, 29, 20, 0.3),
        0 0 8px rgba(107, 29, 20, 0.15);
    }
    to {
      text-shadow:
        0 0 8px rgba(212, 160, 23, 0.5),
        0 0 16px rgba(212, 160, 23, 0.25);
    }
  }

  .tagline-sub {
    color: #5a3a28;
    font-size: 1.1rem;
    max-width: 560px;
    margin: 0 auto 2rem;
  }

  .tagline-btn {
    background: transparent;
    border: 2px solid #6b1d14;
    color: #6b1d14;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 0.75rem 2rem;
    border-radius: 50px;
    transition: all 0.3s ease;
  }

  .tagline-btn:hover {
    background: #6b1d14;
    color: #d4a017;
    box-shadow: 0 4px 14px rgba(107, 29, 20, 0.35);
    transform: translateY(-2px);
  }

  @media (prefers-reduced-motion: reduce) {
    .tagline-heading { animation: none; }
  }
</style>
<script>
(function () {
  // Starts on the brand line ("One Spice. Every Dish. Every Time."), then rotates through a few
  // others and comes back to it. The real text stays in the HTML + aria-label for SEO/screen readers.
  var h = document.getElementById('taglineHeading');
  if (!h || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  var a = h.querySelector('.tl-a'), b = h.querySelector('.tl-b');
  var lines = [
    ['One Spice.', 'Every Dish. Every Time.'],
    ['Taste Like', 'Never Before.'],
    ['Ground Fresh.', 'Packed With Care.'],
    ['Pure Spice.', 'True Heritage.']
  ];
  var i = 0;
  setInterval(function () {
    if (document.hidden) return;
    h.classList.add('fading');
    setTimeout(function () {
      i = (i + 1) % lines.length;
      a.textContent = lines[i][0];
      b.textContent = lines[i][1];
      h.classList.remove('fading');
    }, 650);
  }, 5000);
})();
</script>
