<!-- 🔥 Tagline Banner -->
<section class="tagline-banner motion-section text-center">
  <div class="container position-relative">
    <div class="tl-spices" aria-hidden="true">
      <i style="--x:8%;  --s:10px; --c:#2f7d4f; --d:9s;  --t:0s"></i>
      <i style="--x:18%; --s:7px;  --c:#c2410c; --d:11s; --t:2s"></i>
      <i style="--x:30%; --s:12px; --c:#e8a317; --d:10s; --t:4s"></i>
      <i style="--x:42%; --s:8px;  --c:#6b1d14; --d:12s; --t:1s"></i>
      <i style="--x:55%; --s:11px; --c:#2f7d4f; --d:9.5s;--t:5s"></i>
      <i style="--x:66%; --s:7px;  --c:#e8a317; --d:11s; --t:3s"></i>
      <i style="--x:77%; --s:10px; --c:#c2410c; --d:10s; --t:6s"></i>
      <i style="--x:88%; --s:8px;  --c:#6b1d14; --d:12s; --t:2.5s"></i>
      <i style="--x:94%; --s:12px; --c:#e8a317; --d:9s;  --t:7s"></i>
    </div>

    <h2 class="tagline-heading" id="taglineHeading" aria-label="One Spice. Every Dish. Every Time."><span class="tl-a"><span class="w" style="--i:0">One</span> <span class="w" style="--i:1">Spice.</span></span> <span class="tl-b"><span class="w" style="--i:2">Every</span> <span class="w" style="--i:3">Dish.</span> <span class="w" style="--i:4">Every</span> <span class="w" style="--i:5">Time.</span><i class="tl-line"></i></span></h2>
    <p class="tagline-sub">Rooted in Tradition. Rich in Flavor. Straight from our partner farms to your kitchen.</p>
    <a href="/products" class="btn tagline-btn">
      <i class="fas fa-fire me-2"></i>Shop The Collection
    </a>
  </div>
</section>

<style>
  .tagline-banner {
    position: relative;
    overflow: hidden;
    padding: 5rem 1rem;
    margin-top: 2rem;
  }

  /* soft turmeric glow that slowly breathes behind the words */
  .tagline-banner::before {
    content: "";
    position: absolute;
    left: 50%; top: 42%;
    width: min(760px, 120%); height: 340px;
    transform: translate(-50%, -50%);
    background: radial-gradient(closest-side, rgba(232, 163, 23, 0.22), rgba(217, 119, 6, 0.10) 55%, transparent 75%);
    animation: tl-breathe 6s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes tl-breathe {
    from { opacity: .55; transform: translate(-50%, -50%) scale(.92); }
    to   { opacity: 1;   transform: translate(-50%, -50%) scale(1.06); }
  }

  .tagline-heading {
    position: relative;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: clamp(1.8rem, 5vw, 3.2rem);
    line-height: 1.15;
    margin-bottom: 1rem;
    filter: drop-shadow(0 3px 8px rgba(107, 29, 20, 0.22));
  }
  .tagline-heading .tl-b { display: block; font-size: 1.1em; transition: opacity .6s ease; }
  .tagline-heading .tl-a { transition: opacity .6s ease; }
  .tagline-heading.fading .tl-a, .tagline-heading.fading .tl-b { opacity: 0; }

  /* every word is painted with a flowing spice gradient (chilli > saffron > turmeric) */
  .tagline-heading .w {
    display: inline-block;
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: tl-flow 7s linear infinite;
    animation-delay: calc(var(--i) * -0.9s);
  }
  .tagline-heading .tl-a .w { background-image: linear-gradient(90deg, #6b1d14, #b91c1c, #d97706, #b91c1c, #6b1d14); }
  .tagline-heading .tl-b .w { background-image: linear-gradient(90deg, #e8a317, #f59e0b, #d97706, #c2410c, #e8a317); }
  @keyframes tl-flow { from { background-position: 0% 0; } to { background-position: 300% 0; } }

  /* words rise in one after another once the banner scrolls into view (JS adds .armed then .in) */
  .tagline-heading.armed .w { opacity: 0; }
  .tagline-heading.armed.in .w {
    animation: tl-in .8s cubic-bezier(.2, .9, .3, 1.25) forwards, tl-flow 7s linear infinite;
    animation-delay: calc(var(--i) * .13s), calc(var(--i) * -0.9s);
  }
  @keyframes tl-in {
    from { opacity: 0; transform: translateY(.7em) rotate(5deg) scale(.9); filter: blur(7px); }
    to   { opacity: 1; transform: none; filter: blur(0); }
  }

  /* gold-to-cardamom underline that draws itself under the second line */
  .tagline-heading .tl-line {
    display: block;
    height: 4px;
    width: 0;
    margin: .3em auto 0;
    border-radius: 4px;
    background: linear-gradient(90deg, #2f7d4f, #e8a317, #c2410c);
    animation: tl-line 1.1s .9s ease-out forwards;
  }
  @keyframes tl-line { to { width: min(260px, 60%); } }

  /* tiny spice specks drifting up (turmeric, chilli, cardamom, clove) */
  .tl-spices { position: absolute; inset: -10px 0; pointer-events: none; overflow: hidden; }
  .tl-spices i {
    position: absolute;
    bottom: -20px;
    left: var(--x);
    width: var(--s); height: var(--s);
    background: var(--c);
    border-radius: 50% 50% 50% 8%;
    opacity: 0;
    animation: tl-drift var(--d) ease-in-out infinite;
    animation-delay: var(--t);
  }
  @keyframes tl-drift {
    0%   { transform: translateY(0) rotate(0deg);        opacity: 0; }
    12%  { opacity: .75; }
    70%  { opacity: .55; }
    100% { transform: translateY(-300px) rotate(300deg); opacity: 0; }
  }

  .tagline-sub {
    position: relative;
    color: #5a3a28;
    font-size: 1.1rem;
    max-width: 560px;
    margin: 0 auto 2rem;
  }

  .tagline-btn {
    position: relative;
    background: transparent;
    border: 2px solid #6b1d14;
    color: #6b1d14;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 0.75rem 2rem;
    border-radius: 50px;
    transition: all 0.3s ease;
  }

  .tagline-btn:hover {
    background: #6b1d14;
    color: #d4a017;
    box-shadow: 0 4px 14px rgba(107, 29, 20, 0.35);
    transform: translateY(-2px);
  }

  @media (max-width: 480px) {
    .tagline-heading { letter-spacing: 0.5px; font-size: 1.7rem; }
    .tagline-heading .tl-b { font-size: 1em; }
  }

  @media (prefers-reduced-motion: reduce) {
    .tagline-banner::before, .tl-spices i, .tagline-heading .w,
    .tagline-heading.armed.in .w, .tagline-heading .tl-line { animation: none; }
    .tagline-heading.armed .w { opacity: 1; }
    .tagline-heading .tl-line { width: min(260px, 60%); }
    .tl-spices { display: none; }
  }
</style>
<script>
(function () {
  // Opens on the brand line ("One Spice. Every Dish. Every Time."), then rotates through a few
  // others and comes back to it. The real text stays in the HTML + aria-label for SEO/screen readers.
  var h = document.getElementById('taglineHeading');
  if (!h || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  var a = h.querySelector('.tl-a'), b = h.querySelector('.tl-b');

  // Words rise in the first time the banner scrolls into view.
  h.classList.add('armed');
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (e) {
      if (e[0].isIntersecting) { h.classList.add('in'); io.disconnect(); }
    }, { threshold: 0.35 });
    io.observe(h);
  } else { h.classList.add('in'); }

  var lines = [
    ['One Spice.', 'Every Dish. Every Time.'],
    ['Taste Like', 'Never Before.'],
    ['Ground Fresh.', 'Packed With Care.'],
    ['Pure Spice.', 'True Heritage.']
  ];
  function words(text, start) {
    return text.split(' ').map(function (w, k) {
      return '<span class="w" style="--i:' + (start + k) + '">' + w + '</span>';
    }).join(' ');
  }
  var i = 0;
  setInterval(function () {
    if (document.hidden || !h.classList.contains('in')) return;
    h.classList.add('fading');
    setTimeout(function () {
      i = (i + 1) % lines.length;
      var n = lines[i][0].split(' ').length;
      a.innerHTML = words(lines[i][0], 0);
      b.innerHTML = words(lines[i][1], n) + '<i class="tl-line"></i>';
      h.classList.remove('fading');
    }, 650);
  }, 6000);
})();
</script>
