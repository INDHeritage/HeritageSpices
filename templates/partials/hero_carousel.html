<!-- 🌟 Hero -->
<div id="hero" class="position-relative">
  <div class="hero-parallax-wrap" style="height: 600px; overflow: hidden; position: relative;">
    <img id="heroParallaxImg" src="{{ url_for('static', filename='images/hero-spices-slate.webp') }}" class="d-block w-100" style="height: 130%; object-fit: cover; object-position: center; position: absolute; top: -8%; left: 0;" alt="Indian Heritage Spices">
  </div>

  <div class="hero-caption d-block bg-gradient bg-opacity-75 rounded p-4 text-center text-md-start">
    <h2 class="fw-bold text-warning">Upholding Indian Heritage</h2>
    <p class="text-light">Bringing 100% organic and authentic spices from Kerala farms.</p>
    <a href="#products" class="btn btn-warning mt-2 shadow">Shop Now</a>
  </div>
</div>

<!-- Optional Style for Caption -->
<style>
  .hero-caption {
    position: absolute;
    bottom: 15%;
    left: 0;
    right: 0;
    background: rgba(0, 0, 0, 0.4);
    padding: 1.5rem;
    border-radius: 0.5rem;
    max-width: 90%;
    margin: auto;
    text-align: center;
  }

  .hero-caption h2 {
    font-size: 2.2rem;
    color: #ffc107;
    font-weight: 700;
    text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.6);
  }

  .hero-caption p {
    font-size: 1.2rem;
    color: #fff;
    text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
    margin-top: 0.5rem;
    margin-bottom: 1rem;
  }

  .hero-caption .btn {
    padding: 0.5rem 1.2rem;
    font-size: 1rem;
    transition: transform 0.3s ease;
  }

  .hero-caption .btn:hover {
    transform: scale(1.05);
  }

  @media (max-width: 768px) {
    .hero-caption {
      bottom: 10%;
      padding: 1rem;
    }

    .hero-caption h2 {
      font-size: 1.5rem;
    }

    .hero-caption p {
      font-size: 1rem;
    }
  }

  @media (max-width: 480px) {
    .hero-caption {
      padding: 0.75rem;
      bottom: 8%;
    }

    .hero-caption h2 {
      font-size: 1.25rem;
    }

    .hero-caption p {
      font-size: 0.9rem;
    }

    .hero-caption .btn {
      font-size: 0.9rem;
      padding: 0.4rem 1rem;
    }
  }
</style>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const parallaxImg = document.getElementById('heroParallaxImg');
  if (parallaxImg && !reduceMotion) {
    window.addEventListener('scroll', () => {
      const offset = Math.min(window.scrollY * 0.15, 60);
      parallaxImg.style.transform = `translateY(${offset}px)`;
    }, { passive: true });
  }
});
</script>
